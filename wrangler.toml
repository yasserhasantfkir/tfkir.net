# Cloudflare Pages — إعدادات wrangler
# تُستخدم فقط عند النشر من سطر الأوامر؛ النشر التلقائي يتم عبر
# .github/workflows/deploy.yml
#
#   node tools/build.mjs
#   node tools/stage.mjs /tmp/tfkir-site
#   npx wrangler pages deploy /tmp/tfkir-site --project-name=tfkir

name = "tfkir"
compatibility_date = "2026-10-17"
pages_build_output_dir = "/tmp/tfkir-site"

# ---------- قاعدة بيانات D1 (المقالات + المستخدمون + الجلسات) ----------
[[d1_databases]]
binding = "DB"
database_name = "tfkir-content"
database_id = "f5bb1a6a-51fb-4ba9-a290-4b30b5f89db1"
migrations_dir = "db"