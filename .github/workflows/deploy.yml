name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build &amp; Publish to Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tfkir.net
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate pages
        run: node tools/build.mjs

      - name: Stage deploy folder
        run: node tools/stage.mjs "${{ runner.temp }}/tfkir-site"

      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@4 pages deploy "${{ runner.temp }}/tfkir-site" \
            --project-name=tfkir \
            --branch=main \
            --commit-hash="${{ github.sha }}" \
            --commit-message="${{ github.event.head_commit.message }}" \
            --commit-dirty=false

      - name: Verify (informational)
        run: |
          # ملاحظة: عدّادات Cloudflare قد تردّ 403 على عناوين GitHub Actions،
          # لذلك هذه الخطوة للتأكيد فقط ولا تُفشل البناء.
          sleep 20
          for url in https://tfkir.net/ https://tfkir.net/about https://tfkir.net/ideas https://tfkir.net/contact; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)
            echo "$url -> $code"
          done
          echo "done"